{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Tech Services Logout | Leoxur Inc.</title>
    <!-- ServiceNow Theme CSS -->
    <link rel="stylesheet" href="{% static 'css/servicenow_theme.css' %}">
    <style>
        body.servicenow-login {
            background-color: #1a2324;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .login-header {
            background-color: #2b3a3b;
            color: #ffffff;
            padding: 2rem;
            text-align: center;
            border-bottom: 4px solid #d97706;
        }
        .login-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .login-header p {
            margin: 0.5rem 0 0 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .login-body {
            padding: 2.25rem 2rem;
            text-align: center;
        }
        .login-footer {
            padding: 1.25rem 2rem;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
        }
        .login-footer a {
            color: #0284c7;
            text-decoration: none;
            font-weight: bold;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="servicenow-login">

    <div class="login-card">
        <div class="login-header">
            <h2><span>🚪</span> Logged Out</h2>
            <p>IT Tech Services Portal</p>
        </div>

        <div class="login-body">
            <div class="snow-alert snow-alert-success" style="margin-bottom: 1.5rem; background-color: #ecfdf5; border-color: #10b981; color: #047857; padding: 0.75rem; border-radius: 4px; font-size: 0.9rem; font-weight: 600;">
                You have successfully logged out of your session.
            </div>
            
            <p style="color: #475569; font-size: 0.95rem; margin-bottom: 1.5rem; font-weight: 500; line-height: 1.4;">
                Thank you for keeping our systems running smoothly!
            </p>

            <a href="{% url 'engineer_login' %}" class="snow-btn snow-btn-primary" style="display: block; width: 100%; box-sizing: border-box; text-decoration: none; text-align: center; line-height: 42px; height: 42px; font-size: 1rem; font-weight: bold; background-color: #2b3a3b; border-color: #2b3a3b; color: white; border-radius: 4px;">
                Log Back In
            </a>
        </div>

        <div class="login-footer">
            <a href="{% url 'home' %}">Exit to Portal Home</a>
        </div>
    </div>

</body>
</html>
