version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: employee_manage_db
    restart: always
    environment:
      MYSQL_DATABASE: employee_manage
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: employee_user
      MYSQL_PASSWORD: employeepassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "80:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-My Organization}
      - DB_ENGINE=mysql
      - DB_NAME=employee_manage
      - DB_USER=employee_user
      - DB_PASSWORD=employeepassword
      - DB_HOST=db
      - DB_PORT=3306
    restart: always

volumes:
  mysql_data:
