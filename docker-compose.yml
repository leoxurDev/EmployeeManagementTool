version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: employee_manage_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-employee_manage}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USER:-employee_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-employeepassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "80:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-My Organization}
      - DB_ENGINE=${DB_ENGINE:-mysql}
      - DB_NAME=${DB_NAME:-employee_manage}
      - DB_USER=${DB_USER:-employee_user}
      - DB_PASSWORD=${DB_PASSWORD:-employeepassword}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
    restart: always

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: employee_manage_pma
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: ${DB_HOST:-db}
      PMA_PORT: ${DB_PORT:-3306}
    ports:
      - "8080:80"

volumes:
  mysql_data:
